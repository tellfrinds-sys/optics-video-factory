const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzc1LjNndVJX4zrBCX27nRd0mwROMDQ3-zoUfM7gu9rHVBDeFvz3VcXMcawaVJfLAI/exec';

function openSignup(source = '') { const modal=document.getElementById('signup-modal'); if(!modal) return; modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false'); const sourceInput=document.getElementById('signup-source'); if(sourceInput) sourceInput.value=source; setTimeout(()=>document.getElementById('signup-name')?.focus(),50); }
function closeSignup(){ const modal=document.getElementById('signup-modal'); if(!modal) return; modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true'); }
function handleSignupSubmit(event){
  event.preventDefault();
  const form=event.currentTarget, button=form.querySelector('button[type="submit"]'), status=document.getElementById('signup-status');
  const email=form.email.value.trim(), phone=form.phone.value.trim();
  if(!email || !phone){ status.textContent=state.lang==='ar'?'البريد الإلكتروني ورقم الهاتف مطلوبان.':'Email and mobile phone are required.'; status.className='og-form-status is-visible error'; return; }
  button.disabled=true; button.textContent=state.lang==='ar'?'جارٍ الحفظ…':'Saving…'; status.className='og-form-status';
  const payload={name:form.name.value.trim(),email,phone,source:form.source.value||'landing-page',submittedAt:new Date().toISOString(),site:'OpticsGate.online'};
  if(GOOGLE_APPS_SCRIPT_URL.includes('PASTE_YOUR_')){
    status.textContent=state.lang==='ar'?'تم تجهيز البيانات. أضف رابط Google Apps Script في متغير الإعداد لإرسالها إلى الشيت.':'Data is ready. Add the Google Apps Script URL in the config variable to send it to the sheet.'; status.className='og-form-status is-visible success'; button.disabled=false; button.textContent=state.lang==='ar'?'سجل اهتمامي':'Register my interest'; return;
  }
  fetch(GOOGLE_APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(()=>{status.textContent=state.lang==='ar'?'شكرًا لإهتمامك. تم تسجيل بياناتك وستكون من أوائل المدعوين في افتتاح بوابة البصريات.':'Thank you for your interest. Your details were recorded and you will be among the first invited to the Optics Gate opening.'; status.className='og-form-status is-visible success'; form.reset();})
    .catch(()=>{status.textContent=state.lang==='ar'?'تعذر الإرسال حاليًا. يرجى المحاولة مرة أخرى.':'Submission failed. Please try again.'; status.className='og-form-status is-visible error';})
    .finally(()=>{button.disabled=false; button.textContent=state.lang==='ar'?'سجل اهتمامي':'Register my interest';});
}
function activateInteractiveItems(){ document.querySelectorAll('.og-card,.og-tag,.og-program-card,.og-equipment-card,.og-play').forEach((item)=>{ item.classList.add('og-clickable'); item.setAttribute('tabindex','0'); item.setAttribute('role','button'); item.addEventListener('click',()=>openSignup(item.innerText.trim().slice(0,80))); item.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSignup(item.innerText.trim().slice(0,80));}}); }); }

      <div style="position:relative;">
        <h2 class="og-heading" style="font-size:30px; font-weight:800; color:#f7f9fc; margin:0 0 16px;">${t.finalTitle}</h2>
        <p style="color:#aebcd4; font-size:15.5px; max-width:480px; margin:0 auto 30px; line-height:1.8;">${t.finalDesc}</p>
        <a href="#signup" onclick="event.preventDefault();openSignup('Telegram')" class="og-btn" style="background:linear-gradient(135deg,${accent},#0d9488); color:#04211d; border-radius:12px; padding:16px 34px; font-size:15.5px; font-weight:800; display:inline-flex; align-items:center; gap:8px; box-shadow:0 18px 40px -14px rgba(20,184,166,0.55);">
          ${t.finalCta}
        </a>
      </div>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <div style="border-top:1px solid rgba(148,178,214,0.12); padding:32px 24px;">
    <div style="max-width:1220px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <img src="assets/logo_nav.png" alt="Optics Gate" style="width:36px; height:36px; object-fit:contain; opacity:.85;" />
        <span style="font-size:13px; color:#7d93b3;">${t.footerRights}</span>
      </div>
      <div style="font-size:12.5px; color:#5c6f8c;">${t.footerTag}</div>
    </div>
  </div>


  <div id="signup-modal" class="og-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="signup-title" onclick="if(event.target===this)closeSignup()">
    <div class="og-modal-card" dir="${t.dir}">
      <button class="og-modal-close" type="button" aria-label="${lang==='ar'?'إغلاق':'Close'}" onclick="closeSignup()">×</button>
      <div style="color:#2dd4bf;font-weight:800;font-size:13px;margin-bottom:10px;">${lang==='ar'?'افتتاح تجريبي':'Beta opening'}</div>
      <h2 id="signup-title" class="og-heading" style="font-size:27px;color:#f7f9fc;margin:0 0 12px;">${lang==='ar'?'شكرًا لإهتمامك':'Thank you for your interest'}</h2>
      <p style="color:#b7c4d8;line-height:1.9;margin:0;">${lang==='ar'?'وهذا افتتاح تجريبي. سجل بياناتك وكن أول المدعوين في افتتاح لبوابة البصريات.':'This is a beta opening. Register your details and be among the first invited to the Optics Gate opening.'}</p>
      <form class="og-form" onsubmit="handleSignupSubmit(event)">
        <label>${lang==='ar'?'الاسم':'Name'}<input id="signup-name" name="name" type="text" autocomplete="name" required /></label>
        <label>${lang==='ar'?'البريد الإلكتروني':'Email'}<input name="email" type="email" autocomplete="email" required /></label>
        <label>${lang==='ar'?'الهاتف النقال':'Mobile phone'}<input name="phone" type="tel" inputmode="tel" autocomplete="tel" required /></label>
        <input id="signup-source" name="source" type="hidden" value="landing-page" />
        <p class="og-form-note">${lang==='ar'?'البريد الإلكتروني والهاتف النقال حقول إلزامية لإتمام التسجيل.':'Email and mobile phone are required to complete registration.'}</p>
        <div id="signup-status" class="og-form-status" role="status" aria-live="polite"></div>
        <button type="submit">${lang==='ar'?'سجل اهتمامي':'Register my interest'}</button>
      </form>
    </div>
  </div>

</div>`;
  activateInteractiveItems();
}

render();
</script>
</body>
</html>
